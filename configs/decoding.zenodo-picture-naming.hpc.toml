# HPC configuration for Zenodo MEG Picture Naming Task decoding (Record 15789569).
#
# Run from the MAS project root:
#   python -u scripts/run_concept_decoding_cli.py \
#     --config configs/decoding.zenodo-picture-naming.hpc.toml

# Path to the trial table generated by scripts/prepare_zenodo_picture_naming_trials.py
# You can switch to trials_step1_visual.csv or trials_step3_covert.csv for step-isolated decoding.
trial_table = "/scratch/g/bgross/CIDMEG_SM/data/meg_picture_naming/trials_all_steps.csv"

# Output directory for predictions, metrics, confusion matrices, and figures
output_dir = "/scratch/g/bgross/CIDMEG_SM/data/meg_picture_naming/decoding_results"

# Decoding classification target:
#   "category": 2-class classification (food vs. tool)
#   "individual": 6-class classification (sushi, dumplings, cookies, comb, knife, pencil)
group_mode = "category"

# Decoder choice:
#   "logistic": Multinomial / binary logistic regression (fast, interpretable)
#   "pairwise_svm": High-performance pairwise linear SVM supertrial decoding
#   "mlp": Multi-layer perceptron neural network
decoder = "logistic"

# Cross-validation / data split
split_mode = "random"
test_fraction = 0.2
validation_fraction = 0.2
min_trials_per_class = 2

# Temporal window (relative to cue/stimulus onset in seconds)
# e.g., 0.0 to 1.0 covers the post-cue cognitive response
window_start = 0.0
window_end = 1.0

# Channel selection:
#   "all": Picks all usable MEG channels (the SHI-MEG system uses 64 whole-head channels)
#   "mag": Magnetometer channels only
channel_mode = "all"
max_channels = 0

# Signal preprocessing & feature extraction
bandpass_low_hz = 0.1
bandpass_high_hz = 150.0
downsample = true
downsample_sfreq = 400.0
no_feature_binning = false
bin_size_ms = 50.0

# Baseline correction & artifact rejection
no_baseline = false
no_mne_epoch_reject = false
reject_mag_ft = 5000.0
reject_grad_ft_cm = 5000.0
include_trial_outliers = false
trial_outlier_z = 6.0
min_trials_for_outlier_qc = 8

# Persistent cache directory for continuous downsampled/filtered recordings
epoch_cache_dir = "/scratch/g/bgross/CIDMEG_SM/mas_epoch_cache"

# Threads per task
torch_num_threads = 4
